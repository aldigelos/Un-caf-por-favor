<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Checkout - Un Café, por favor</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <header>
        <div class="logo">
            Un Café, por favor ☕
        </div>

        <nav>
            <a href="index.html">Volver a la tienda</a>
        </nav>
    </header>

    <main>

        <section class="checkout-section">

            <h1>Finalizá tu compra</h1>

            <p>Completá tus datos para continuar.</p>

            <label for="name">Nombre</label>
            <input type="text" id="name" placeholder="Tu nombre">

            <label for="email">Email</label>
            <input type="email" id="email" placeholder="tu@email.com">

            <label for="address">Dirección</label>
            <input type="text" id="address" placeholder="Tu dirección">

            <br><br>

            <a href="https://aldigelos.github.io/Un-caf-por-favor/success.html"
               class="button">
                Confirmar compra
            </a>

        </section>

    </main>

    <footer>
        <p>© 2026 Un Café, por favor</p>
    </footer>

</body>

</html>
